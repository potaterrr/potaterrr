<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="Terminal typing: curl -fsSL https://potaterrr.github.io/install | sh">
  <!-- window chrome -->
  <rect x="1.5" y="1.5" width="517" height="117" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="517" height="30" rx="10" fill="#161b22"/>
  <line x1="1.5" y1="31" x2="518.5" y2="31" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="16.5" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="16.5" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="16.5" r="5.5" fill="#28c840"/>
  <text x="260" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">potaterrr@debian: ~</text>

  <!-- typewriter clip: types over 45% of the 7s loop, holds, restarts -->
  <defs>
    <clipPath id="type">
      <rect x="24" y="0" height="120" width="0">
        <animate attributeName="width" values="0;424;424" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#type)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="24" y="72" fill="#3fb950">$</text>
    <text x="40" y="72" fill="#e6edf3">curl -fsSL <tspan fill="#58a6ff">https://potaterrr.github.io/install</tspan> | sh</text>
  </g>

  <!-- blinking block cursor, rides along with the typing -->
  <rect x="24" y="60" width="8" height="16" fill="#3fb950">
    <animate attributeName="x" values="24;442;442" keyTimes="0;0.45;1" dur="7s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
